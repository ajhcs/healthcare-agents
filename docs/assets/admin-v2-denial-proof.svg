<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Synthetic denial investigation, calculated by Healthcare Agents v2</title><desc id="desc">100 denied of 1000 baseline claims and 180 of 1000 current claims. Rates are 10 and 18 percent. Difference is 8 percentage points and 80 percent relative. Recovery is unknown.</desc><rect width="1200" height="520" fill="#f5f4ef"/><g font-family="Arial,sans-serif" fill="#163b36"><text x="54" y="58" font-size="17" letter-spacing="2">HEALTHCARE AGENTS / SYNTHETIC WORKFLOW PROOF</text><text x="54" y="112" font-size="38" font-weight="bold">Denial rate: show the denominator.</text><text x="54" y="174" font-size="21">Baseline: 100 / 1000 claims</text><rect x="54" y="196" width="240" height="47" fill="#8daea3"/><text x="320" y="229" font-size="30">10%</text><text x="54" y="296" font-size="21">Current: 180 / 1000 claims</text><rect x="54" y="317" width="432" height="47" fill="#1d695a"/><text x="511" y="351" font-size="30">18%</text><path d="M660 160V388" stroke="#c5cec8"/><text x="707" y="216" font-size="58" font-weight="bold">+8 pp</text><text x="707" y="260" font-size="23">80% relative increase</text><text x="707" y="319" font-size="19">Denied dollars: $42,000</text><text x="707" y="352" font-size="19">Recoverable cash: unknown</text><text x="54" y="432" font-size="18">Draft for human review / aligned cohorts and dated policy still required</text><text x="54" y="476" font-size="14">Fixture SHA256: 5f0ae22d03f9a04f53d489d7b9fe08c15a6d542e9f39447ea284a2becffd01d3</text></g></svg>
