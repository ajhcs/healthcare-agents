<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1180" viewBox="0 0 640 1180" role="img" aria-labelledby="title desc"><title id="title">Administrative workflow with evidence and human review</title><desc id="desc">An administrative task and selected skill lead to a host-produced draft using approved evidence and dates. Optional local calculation uses validated aggregate inputs. Qualified human review precedes authorized next steps. This is a conceptual overview, not automatic execution.</desc><rect width="640" height="1180" rx="24" fill="#F7F5ED"/><text x="40" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#163C3B">From a task to a</text><text x="40" y="117" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#163C3B">reviewable artifact</text><rect x="40" y="165" width="560" height="230" rx="20" fill="#FFFDF7" stroke="#BACABD" stroke-width="2"/><text x="65" y="207" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#177369">01</text><text x="125" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#163C3B">Frame</text><text x="65" y="276" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#163C3B">Administrative task</text><text x="65" y="322" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#48615D">Selected skill / workflow</text><rect x="40" y="445" width="560" height="230" rx="20" fill="#FFFDF7" stroke="#BACABD" stroke-width="2"/><text x="65" y="487" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#177369">02</text><text x="125" y="490" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#163C3B">Develop</text><text x="65" y="556" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#163C3B">Host-produced draft</text><text x="65" y="602" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#48615D">Approved evidence + dates</text><rect x="40" y="865" width="560" height="230" rx="20" fill="#FFFDF7" stroke="#BACABD" stroke-width="2"/><text x="65" y="907" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#177369">03</text><text x="125" y="910" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#163C3B">Review</text><text x="65" y="976" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#163C3B">Qualified human review</text><text x="65" y="1022" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#48615D">Authorized next steps</text><path d="M320 409V431M310 421L320 431L330 421" fill="none" stroke="#177369" stroke-width="3" stroke-linecap="round"/><path d="M600 560H620V980H603M613 970L603 980L613 990" fill="none" stroke="#177369" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 705V679M310 689L320 679L330 689" fill="none" stroke="#177369" stroke-width="3" stroke-linecap="round"/><rect x="40" y="705" width="560" height="110" rx="18" fill="#DDECE4"/><text x="65" y="748" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#163C3B">Optional local calculation</text><text x="65" y="786" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#48615D">Validated aggregate inputs</text><text x="40" y="1140" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#48615D">People own decisions and authorized action.</text></svg>
