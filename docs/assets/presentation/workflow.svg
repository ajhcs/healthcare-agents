<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Administrative work, with evidence and human ownership</title><desc id="desc">An administrative task and selected skill or workflow lead to a host-produced draft using approved evidence and dates. An optional local calculation uses validated aggregate inputs. Qualified human review precedes authorized next steps. A draft or metric does not establish operational completion.</desc><rect width="1200" height="820" rx="24" fill="#F7F5ED"/><text x="56" y="77" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#163C3B">From a task to a reviewable artifact</text><text x="56" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#48615D">The host model drafts. People own decisions and action.</text><rect x="56" y="181" width="324" height="330" rx="20" fill="#FFFDF7" stroke="#BACABD" stroke-width="2"/><text x="84" y="231" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#177369">01</text><text x="84" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#163C3B">Frame</text><text x="84" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#163C3B">Administrative task</text><text x="84" y="389" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#48615D">Selected skill / workflow</text><path d="M84 451H352" stroke="#D3DCD0" stroke-width="2"/><rect x="438" y="181" width="324" height="330" rx="20" fill="#FFFDF7" stroke="#BACABD" stroke-width="2"/><text x="466" y="231" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#177369">02</text><text x="466" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#163C3B">Develop</text><text x="466" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#163C3B">Host-produced draft</text><text x="466" y="389" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#48615D">Approved evidence + dates</text><path d="M466 451H734" stroke="#D3DCD0" stroke-width="2"/><rect x="820" y="181" width="324" height="330" rx="20" fill="#FFFDF7" stroke="#BACABD" stroke-width="2"/><text x="848" y="231" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#177369">03</text><text x="848" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#163C3B">Review</text><text x="848" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#163C3B">Qualified human review</text><text x="848" y="389" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#48615D">Authorized next steps</text><path d="M848 451H1116" stroke="#D3DCD0" stroke-width="2"/><path d="M392 343H422M412 333L422 343L412 353" stroke="#177369" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M774 343H804M794 333L804 343L794 353" stroke="#177369" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="438" y="577" width="324" height="126" rx="18" fill="#DDECE4"/><text x="463" y="616" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#163C3B">Optional local calculation</text><text x="463" y="655" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#48615D">Validated aggregate inputs</text><path d="M600 577V522M590 532L600 522L610 532" stroke="#177369" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="763" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#48615D">A draft or calculated metric does not establish operational completion.</text></svg>
